name: GOOBUS QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: node --check assets/app.js
      - name: Production build
        run: npm run build
      - name: No legacy files
        run: npm run test:files
      - name: Footer services
        run: npm run test:footer
      - name: Canonical routes
        run: npm run test:routes
      - name: Apache configuration
        run: npm run test:server
