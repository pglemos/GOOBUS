name: GOOBUS QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
          show-progress: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply shared hero cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/remove-ai-hero-labels'
        run: |
          node scripts/remove-artificial-hero-chrome.mjs
          if ! git diff --quiet -- assets/app.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/app.js
            git commit -m "fix: remove rótulos artificiais dos heróis"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: JavaScript syntax
        run: node --check assets/app.js
      - name: Production build
        run: npm run build
      - name: No legacy files
        run: npm run test:files
      - name: Canonical routes
        run: npm run test:routes
      - name: Apache configuration
        run: npm run test:server
