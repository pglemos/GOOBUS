name: GOOBUS QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/unificar-design-cinematografico-rotas]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Route consistency tests
        run: npm test
      - name: Production build
        run: npm run build
